name: Auto-Build & Release SMD

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if a release already exists for this commit"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_REPO: "jericjan/SMD"

permissions:
  contents: write

concurrency:
  group: smd-build
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1) Sync fork -> check upstream (stable + beta) -> build matrix
  # ---------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORK: ${{ github.repository }}
    steps:
    - name: Sync fork with upstream
      id: sync
      continue-on-error: true
      run: |
        # Same as the "Sync fork" button on GitHub (merges upstream/main into fork/main)
        gh api -X POST "repos/$FORK/merge-upstream" -f branch=main

    - name: Plan builds
      id: plan
      run: |
        set -euo pipefail
        UP="$UPSTREAM_REPO"
        FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force }}"

        exists() { gh release view "$1" --repo "$FORK" >/dev/null 2>&1; }

        # If sync fails (conflict / upstream changed workflow files...), build straight from upstream
        if [ "${{ steps.sync.outcome }}" = "success" ]; then
          S_REPO="$FORK"
        else
          echo "::warning::Fork sync failed, stable will be built directly from upstream main"
          S_REPO="$UP"
        fi

        ENTRIES='[]'

        # ---------- STABLE ----------
        S_SHA=$(gh api "repos/$S_REPO/commits/main" --jq .sha)
        S_REL=$(gh api "repos/$UP/releases/latest")
        S_TAG=$(jq -r .tag_name <<<"$S_REL")
        S_VER="${S_TAG#v}"
        S_DATE=$(jq -r .published_at <<<"$S_REL")
        S_RTAG="stable-${S_VER}-${S_SHA:0:7}"

        if [ "$FORCE" = "true" ] || ! exists "$S_RTAG"; then
          ENTRIES=$(jq -c --arg repo "$S_REPO" --arg ref "$S_SHA" --arg ver "$S_VER" --arg tag "$S_RTAG" \
            '. + [{channel:"stable", repo:$repo, ref:$ref, version:$ver, tag:$tag, prerelease:false}]' <<<"$ENTRIES")
        else
          echo "Stable $S_RTAG already released, skipping."
        fi

        # ---------- BETA (latest upstream pre-release) ----------
        B_REL=$(gh api "repos/$UP/releases?per_page=30" \
          --jq '[.[] | select(.prerelease and (.draft | not))][0] // empty')

        if [ -n "$B_REL" ]; then
          B_TAG=$(jq -r .tag_name <<<"$B_REL")
          B_DATE=$(jq -r .published_at <<<"$B_REL")

          # Only build beta if it is newer than the stable release
          if [[ "$B_DATE" > "$S_DATE" ]]; then
            B_VER="${B_TAG#v}"
            B_SHA=$(gh api "repos/$UP/commits/$B_TAG" --jq .sha)
            B_RTAG="beta-${B_VER}-${B_SHA:0:7}"
            if [ "$FORCE" = "true" ] || ! exists "$B_RTAG"; then
              ENTRIES=$(jq -c --arg repo "$UP" --arg ref "$B_SHA" --arg ver "$B_VER" --arg tag "$B_RTAG" \
                '. + [{channel:"beta", repo:$repo, ref:$ref, version:$ver, tag:$tag, prerelease:true}]' <<<"$ENTRIES")
            else
              echo "Beta $B_RTAG already released, skipping."
            fi
          else
            echo "Pre-release $B_TAG is older than stable, skipping beta."
          fi
        else
          echo "Upstream has no pre-release."
        fi

        COUNT=$(jq length <<<"$ENTRIES")
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "matrix={\"include\":$ENTRIES}" >> "$GITHUB_OUTPUT"
        echo "Builds planned: $COUNT"; jq . <<<"$ENTRIES"

  # ---------------------------------------------------------------
  # 2) Build each channel (stable / beta)
  # ---------------------------------------------------------------
  build:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Build ${{ matrix.channel }} (${{ matrix.version }})
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        repository: ${{ matrix.repo }}
        ref: ${{ matrix.ref }}

    - name: Prepare Metadata
      shell: pwsh
      run: |
        $date = Get-Date -Format "yyyy-MM-dd"
        echo "BUILD_DATE=$date" >> $env:GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync

    - name: Download & Extract Latest Tools
      shell: pwsh
      run: |
        # --- Aria2 ---
        $ariaApi = Invoke-RestMethod -Uri "https://api.github.com/repos/jericjan/aria2/releases"
        $ariaAsset = $ariaApi[0].assets | Where-Object { $_.name -like "*windows.zip" } | Select-Object -First 1
        Invoke-WebRequest -Uri $ariaAsset.browser_download_url -OutFile "aria2.zip"
        Expand-Archive -Path "aria2.zip" -DestinationPath "temp_aria2" -Force
        New-Item -ItemType Directory -Force -Path "third_party/aria2c"
        Copy-Item -Path (Get-ChildItem -Path "temp_aria2" -Filter "aria2c.exe" -Recurse).FullName -Destination "third_party/aria2c/aria2c.exe"

        # --- GBE Fork Tools ---
        $gbeApi = Invoke-RestMethod -Uri "https://api.github.com/repos/Detanup01/gbe_fork_tools/releases"
        $gbeAsset = $gbeApi[0].assets | Where-Object { $_.name -match "win" -and $_.name -like "*.zip" } | Select-Object -First 1
        Invoke-WebRequest -Uri $gbeAsset.browser_download_url -OutFile "gbe.zip"
        Expand-Archive -Path "gbe.zip" -DestinationPath "temp_gbe" -Force
        New-Item -ItemType Directory -Force -Path "third_party/gbe_fork_tools"
        $gbeFolder = Get-ChildItem -Path "temp_gbe" -Filter "generate_emu_config" -Recurse -Directory
        Copy-Item -Path $gbeFolder.FullName -Destination "third_party/gbe_fork_tools/" -Recurse -Force

    - name: Setup GCC (MSYS2)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc

    - name: Build C Library
      run: |
        cd c
        gcc midi_player_lib.c -shared -fPIC -o midi_player_lib.dll
        cd ..

    - name: Build EXE with PyInstaller
      run: uv run pyinstaller main.spec

    - name: Package Release
      shell: pwsh
      run: |
        Remove-Item -Path "dist/*.zip" -Force -ErrorAction SilentlyContinue
        $zipName = "SMD_Windows_Build_${{ matrix.version }}.zip"
        Compress-Archive -Path "dist/main/*" -DestinationPath "$zipName"
        echo "ZIP_FILENAME=$zipName" >> $env:GITHUB_ENV

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ matrix.tag }}
        name: "SMD ${{ matrix.version }} (${{ matrix.channel }}) - ${{ env.BUILD_DATE }}"
        prerelease: ${{ matrix.prerelease }}
        body: |
          Automated ${{ matrix.channel }} build.
          Source: ${{ matrix.repo }} @ ${{ matrix.ref }}
          Upstream version: ${{ matrix.version }}
          Run: ${{ github.run_number }}
        files: ${{ env.ZIP_FILENAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
